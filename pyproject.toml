[project]
name = "jetson-orin-nano-vlm-benchmarks"
version = "0.1.0"
description = "Setup, deployment, and benchmarking of compact vision-language models on NVIDIA Jetson Orin Nano."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = []

[dependency-groups]
download = [
    "huggingface-hub>=0.34,<2",
    "safetensors>=0.5,<1",
]
inference = [
    "num2words>=0.5,<1",
    "pillow>=10,<13",
    "safetensors>=0.5,<1",
    "transformers>=4.49,<6",
]
yolo = [
    "numpy>=1.26,<2",
    "ultralytics>=8.3,<9",
]

[tool.uv]
package = false
